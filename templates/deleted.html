<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигнатура недоступна — IsoArch Service</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=20260929-3">
</head>
<body>
<div class="app-shell">
    {% include "partials/_topnav.html" %}

    <main class="page-main">
        <div class="empty-state" style="padding-top: 80px;">
            <div style="width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: rgba(207, 59, 59, 0.1); display: flex; align-items: center; justify-content: center; color: var(--color-accent);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
            </div>
            <h2 style="font-size: 18px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 8px;">
                Изотопная сигнатура недоступна
            </h2>
            <p style="color: var(--color-text-secondary); max-width: 280px; margin: 0 auto 20px; font-size: 14px; line-height: 1.4;">
                Запись не найдена или недоступна для просмотра.
            </p>
            <a href="{{ url_for('isotopic_signatures_list') }}" class="btn btn--primary btn--compact">
                Вернуться в каталог
            </a>
        </div>
    </main>

    {% set active_tab = "feed" %}
    {% include "partials/_tabbar.html" %}
</div>
</body>
</html>
