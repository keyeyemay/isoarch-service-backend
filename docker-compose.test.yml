# Isolated, disposable verification services. Data lives only in container tmpfs.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${LR4_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: isoarch_test
      POSTGRES_USER: isoarch_test
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isoarch_test -d isoarch_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    tmpfs:
      - /data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
